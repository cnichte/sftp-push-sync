name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Linux release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -w @sftp-push-sync/gui -- --linux --publish always

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: velosync-linux-${{ inputs.tag || github.ref_name }}
          path: |
            packages/gui/release/*.AppImage
            packages/gui/release/latest-linux.yml
          if-no-files-found: error