name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux release
        run: npm run dist -w @sftp-push-sync/gui -- --linux

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: velosync-linux-${{ inputs.tag || github.ref_name }}
          path: |
            packages/gui/release/*.AppImage
            packages/gui/release/*.yml
            packages/gui/release/*.blockmap
          if-no-files-found: error

      - name: Publish GitHub Release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            packages/gui/release/*.AppImage
            packages/gui/release/*.yml
            packages/gui/release/*.blockmap